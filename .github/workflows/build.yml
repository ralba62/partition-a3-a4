name: Fabriquer les applications

on:
  workflow_dispatch:   # se lance à la main, depuis l'onglet Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nom: Mac-ApplePuce-M1-M2-M3-M4
          - os: macos-15-intel
            nom: Mac-Intel
          - os: windows-2025
            nom: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf numpy pillow pyinstaller

      - name: Composant de lecture des numéros (Mac)
        if: runner.os == 'macOS'
        run: pip install pyobjc-framework-Vision

      - name: Composant de lecture des numéros (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item -Recurse "C:\Program Files\Tesseract-OCR" "vendor\tesseract"

      - name: Fabriquer l'application
        run: pyinstaller --noconfirm a3a4.spec

      - name: Auto-test (Mac)
        if: runner.os == 'macOS'
        run: |
          set +e
          "dist/Partition A3 vers A4.app/Contents/MacOS/Partition A3 vers A4" --selftest
          code=$?
          echo "### ${{ matrix.nom }}" >> "$GITHUB_STEP_SUMMARY"
          cat selftest.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Auto-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Partition A3 vers A4\Partition A3 vers A4.exe" -ArgumentList "--selftest" -Wait -PassThru
          "### ${{ matrix.nom }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path selftest.txt) { Get-Content selftest.txt; Get-Content selftest.txt | Add-Content $env:GITHUB_STEP_SUMMARY }
          if ($p.ExitCode -eq 1) { exit 1 }
          exit 0

      - name: Emballer (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Partition A3 vers A4.app" "Partition-A3-vers-A4-${{ matrix.nom }}.zip"

      - name: Emballer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\Partition A3 vers A4" -DestinationPath "Partition-A3-vers-A4-${{ matrix.nom }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Partition-A3-vers-A4-${{ matrix.nom }}
          path: Partition-A3-vers-A4-${{ matrix.nom }}.zip
          retention-days: 30
